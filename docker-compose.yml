version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: semester-platform:v2026.10-l9
    container_name: semester-web-edge
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - SEMESTER_INSTITUTION_NAME=Vanderbilt University
      - SEMESTER_SSO_DOMAIN=vanderbilt.edu
      - VITE_SEMESTER_INTELLIGENCE=production
      - VITE_FERPA_ISOLATION=enforced
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
