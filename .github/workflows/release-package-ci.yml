name: Supplemental release CI
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: python3 -m unittest discover -s scripts/release -p 'test_evidence_bundle.py'
      - run: bash -n scripts/release/deploy-vercel.sh
      - run: npm run lint --workspace app
      - run: npm test --workspace app
      - run: npm run build --workspace app
      - run: npm run check:university --workspace app
      - run: npm run platform-control:test
      - run: npm run registry:validate
